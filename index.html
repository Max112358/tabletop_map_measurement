<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Map Measure</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <button id="import-btn" class="btn">Import image</button>
      <input
        id="file-input"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        hidden
      />
      <div class="tool-group" role="group" aria-label="Tools">
        <button id="tool-scale" class="btn tool active">Scale</button>
        <button id="tool-measure" class="btn tool">Measure</button>
      </div>
      <div class="tool-group" role="group" aria-label="Zoom">
        <button id="zoom-out" class="btn" title="Zoom out">&minus;</button>
        <button id="zoom-in" class="btn" title="Zoom in">+</button>
        <button id="zoom-fit" class="btn" title="Fit image to view">Fit</button>
      </div>
      <div class="scale-inputs">
        <label>
          Key distance
          <input
            id="scale-distance"
            type="number"
            min="0"
            step="any"
            value="1"
          />
        </label>
        <label>
          Unit
          <select id="scale-unit">
            <option value="mi">mi</option>
            <option value="km">km</option>
            <option value="ft">ft</option>
            <option value="m">m</option>
          </select>
        </label>
      </div>
      <label class="slider-label">
        Overlay opacity
        <input id="overlay-alpha" type="range" min="0.1" max="1" step="0.05" />
      </label>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <h2>Distances</h2>
        <p id="scale-status" class="hint">
          Set the scale first: click two points on the map's distance key.
        </p>
        <ol id="leg-list" class="legs"></ol>
        <div id="total" class="total"></div>
        <h2>Help</h2>
        <ul class="hint">
          <li>Click empty map: add waypoint</li>
          <li>Drag a node: move it</li>
          <li>Click a waypoint: delete it</li>
          <li>Scroll wheel: zoom at cursor</li>
        </ul>
      </aside>
      <div class="canvas-wrap">
        <canvas id="map-canvas"></canvas>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
